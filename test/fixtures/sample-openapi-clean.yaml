openapi: 3.0.3
info:
  title: Sample Clean API
  version: 1.0.0
security: []
paths:
  /v1/users:
    get:
      operationId: listUsers
      summary: List all users
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createUser
      summary: Create a new user
      responses:
        "201":
          description: User created
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Number of seconds before retrying
              schema:
                type: integer
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/{id}:
    get:
      operationId: getUserById
      summary: Get a user by ID
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: id
          in: path
          required: true
          example: "123"
          schema:
            type: string
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          type: object
          properties:
            createdBy:
              type: string
              description: who created this user
    Error:
      type: object
      properties:
        message:
          type: string
