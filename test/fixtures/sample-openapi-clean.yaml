openapi: 3.0.3
info:
  title: Sample Clean API
  version: 1.0.0
security: []
paths:
  /users:
    get:
      operationId: listUsers
      summary: List all users
      responses:
        "200":
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      summary: Create a new user
      responses:
        "201":
          description: User created
  /users/{id}:
    get:
      operationId: getUserById
      summary: Get a user by ID
      responses:
        "200":
          description: A single user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      parameters:
        - name: id
          in: path
          required: true
          example: "123"
          schema:
            type: string
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        metadata:
          type: object
          properties:
            createdBy:
              type: string
              description: who created this user
