asyncapi: "3.0.0"
info:
  title: Clean Notification Service V3
  version: "1.0.0"

channels:
  userSignedUp:
    address: user/signedup
    description: Channel for user sign up events
    messages:
      userSignedUpMessage:
        description: Payload when a user signs up
        payload:
          type: object
          properties:
            userId:
              type: string
              description: The unique user ID
            email:
              type: string
              description: The user email address
  orderCreated:
    address: order/created
    description: Channel for order creation events
    messages:
      orderCreatedMessage:
        description: Payload when an order is created
        payload:
          type: object
          properties:
            orderId:
              type: string
              description: Order ID
            total:
              type: number
              description: Order total amount

operations:
  onUserSignedUp:
    action: receive
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/userSignedUpMessage'
  onOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderCreated'
    messages:
      - $ref: '#/channels/orderCreated/messages/orderCreatedMessage'
